<rect id="trigger" class="hit" x="1566" y="174" width="334" height="45"/></svg>
<script>
(() => {
  const ORDER = ["sa5", "sa1", "sa4", "sa2"];
  const state = { selected: "sa1", hovered: null, open: true };
  const $ = id => document.getElementById(id);
  const show = (id, on) => { $(id).style.display = on ? "" : "none"; };

  function render() {
    const shown = (state.open && state.hovered) || state.selected;
    ORDER.forEach(sa => {
      show("box_" + sa, sa === shown);
      show("txt_" + sa, sa === state.selected);
      show("sel_" + sa, sa === state.selected);
      show("row_" + sa, sa !== state.selected);
    });
    show("trig_open", state.open);
    show("trig_closed", !state.open);
    show("list", state.open);
  }

  document.querySelectorAll(".opt").forEach(r => {
    r.addEventListener("mouseenter", () => { state.hovered = r.dataset.sa; render(); });
    r.addEventListener("mouseleave", () => { state.hovered = null; render(); });
    r.addEventListener("click", e => { e.stopPropagation(); state.selected = r.dataset.sa; state.hovered = null; state.open = false; render(); });
  });
  $("trigger").addEventListener("click", e => { e.stopPropagation(); state.open = !state.open; state.hovered = null; render(); });
  document.addEventListener("click", () => { if (state.open) { state.open = false; state.hovered = null; render(); } });

  render();
})();
</script>
